name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oenodpay
          POSTGRES_PASSWORD: oenodpay
          POSTGRES_DB: oenodpay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oenodpay" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # API tests run against both the in-memory store and this real PostgreSQL database.
      TEST_DATABASE_URL: postgres://oenodpay:oenodpay@localhost:5432/oenodpay_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web lint
      - run: pnpm --filter web build
