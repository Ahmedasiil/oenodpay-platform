# Local development services. Production runs on managed services in a Canadian region.
# The API applies database migrations itself on start (or run: pnpm --filter @oenodpay/api db:migrate).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oenodpay
      POSTGRES_PASSWORD: localdev-only
      POSTGRES_DB: oenodpay
    ports:
      - "5432:5432"
